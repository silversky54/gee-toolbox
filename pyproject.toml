[project]
name = "gee-toolbox"
version = "0.2.1"
description = "Helpful functions and objects for Google Earth Engine processes"
license = "Apache-2.0"
authors = [{ name = "Erick G", email = "erick.linares@gmail.com" }]
maintainers = [{ name = "Erick G", email = "erick.linares@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
keywords = ["earthengine", "gee", "google-earth-engine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["earthengine-api>=0.1.418,<2.0.0", "tqdm>=4.66.5,<5.0.0"]

[project.urls]
Repository = "https://github.com/silversky54/gee-toolbox"

[dependency-groups]
dev = [
    "jupyter>=1.1.1,<2.0.0",
    "python-semantic-release>=9.15.2,<10.0.0",
    "ruff>=0.15.15,<1.0.0",
]
test = [
    "pytest>=8.3.2,<9.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gee_toolbox"]

[tool.uv]
default-groups = ["dev", "test"]

[tool.semantic_release]
commit_parser = "conventional-monorepo"
version_toml = ["pyproject.toml:project.version"]
major_on_zero = false
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.commit_parser_options]
# follows conventional commit spec
# https://www.conventionalcommits.org/
# See angular spec for tags descriptions
# https://github.com/angular/angular/blob/22b96b9/CONTRIBUTING.md#type
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
other_allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "style",
    "refactor",
    "test",
]
allowed_tags = [
    "feat",
    "fix",
    "perf",
    "build",
    "chore",
    "ci",
    "docs",
    "style",
    "refactor",
    "test",
]
default_bump_level = 0
parse_squash_commits = true
ignore_merge_commits = true


[tool.semantic_release.changelog]
mode = "update"


[tool.semantic_release.changelog.default_templates]
mask_initial_release = true

[tool.semantic_release.commit_author]
env = "GIT_AUTHOR_NAME"
default = "Erick <erick.linares@gmail.com>"

[tool.semantic_release.remote]
name = "origin"
url = "https://github.com/silversky54/gee-toolbox.git"
type = "github"

[tool.semantic_release.publish]
upload_to_vcs_release = false
