[project]
name = "gee-toolbox"
version = "0.4.1"
description = "Helpful functions and objects for Google Earth Engine processes"
license = "Apache-2.0"
authors = [{ name = "Erick G", email = "erick.linares@gmail.com" }]
maintainers = [{ name = "Erick G", email = "erick.linares@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
keywords = ["earthengine", "gee", "google-earth-engine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "earthengine-api>=0.1.418,<2.0.0",
    "tqdm>=4.66.5,<5.0.0",
    "prettytable>=3.10.1,<4.0.0",
    "pytz>=2026.3.post1",
]

[project.urls]
Repository = "https://github.com/silversky54/gee-toolbox"

[project.optional-dependencies]
docs = [
    "sphinx>=9.0,<10.0",
    "sphinx-autoapi>=3.6,<4",
    "sphinx-design>=0.7.0,<0.8.0",
    "furo>=2025.12.19",
    "myst-parser>=5.1.0,<6",
]

[dependency-groups]
docs = ["gee-toolbox[docs]"]
dev = [
    { include-group = "docs" },
    "jupyter>=1.1.1,<2.0.0",
    "python-semantic-release>=10.5.3,<11",
    "ruff>=0.15.15,<1.0.0",
]
test = [
    "pytest>=8.3.2,<9.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gee_toolbox"]

[tool.uv]
default-groups = ["dev", "test"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = [".venv", "**/.venv", "dist", "build", "**/migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (PEP 8)
    "W",   # pycodestyle warnings
    "F",   # Pyflakes (logical errors, unused variables)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modernizes Python 3.13 syntax)
    "B",   # flake8-bugbear (common design flaws and bugs)
    "SIM", # flake8-simplify (helps write clean, readable code)
    "RUF", # Ruff-specific rules
    "N",   # pep8-naming (enforces standard naming conventions)
    "YTT", # flake8-2020 (prevents system version compatibility errors)
    "D",   # pydocstyle (enforces docstring conventions)
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",
    "N802",
] # skip all docstring rules, and allow non-snake_case test names if needed
"notebooks/**" = ["D", "E501"]
"**/__init__.py" = ["D"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.semantic_release]
commit_parser = "conventional-monorepo"
version_toml = ["pyproject.toml:project.version"]
commit_message = "Bump gee-toolbox to v{version}"
allow_zero_version = true
major_on_zero = false
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.commit_parser_options]
# follows conventional commit spec
# https://www.conventionalcommits.org/
# See angular spec for tags descriptions
# https://github.com/angular/angular/blob/22b96b9/CONTRIBUTING.md#type
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
other_allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "style",
    "refactor",
    "test",
]
allowed_tags = [
    "feat",
    "fix",
    "perf",
    "build",
    "chore",
    "ci",
    "docs",
    "style",
    "refactor",
    "test",
]
default_bump_level = 0
parse_squash_commits = true
ignore_merge_commits = true


[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''docs(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
    '''refactor(?:\([^)]*?\))?: .+''',
    '''test(?:\([^)]*?\))?: .+''',
    '''build(?:\([^)]*?\))?: .+''',
    '''Initial [Cc]ommit.*''',
]


[tool.semantic_release.changelog.default_templates]
mask_initial_release = true

[tool.semantic_release.commit_author]
env = "GIT_AUTHOR_NAME"
default = "Erick <erick.linares@gmail.com>"

[tool.semantic_release.remote]
name = "origin"
url = "https://github.com/silversky54/gee-toolbox.git"
type = "github"
ignore_token_for_push = true

[tool.semantic_release.publish]
upload_to_vcs_release = false
